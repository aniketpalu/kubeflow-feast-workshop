apiVersion: v1
kind: ConfigMap
metadata:
  name: feast-config
  namespace: mlops-workshop
data:
  feature_store.yaml: |
    project: fraud_detection
    provider: local
    registry:
      registry_type: sql
      path: postgresql://feast:feast@postgres.mlops-workshop.svc.cluster.local:5432/feast
    offline_store:
      type: postgres
      host: postgres.mlops-workshop.svc.cluster.local
      port: 5432
      database: feast
      db_schema: public
      user: feast
      password: feast
    online_store:
      type: sqlite
      path: /tmp/feast_online_store.db
    entity_key_serialization_version: 3
