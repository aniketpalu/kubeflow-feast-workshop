---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyter
  namespace: mlops-workshop

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: mlops-workshop
  labels:
    app: jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      serviceAccountName: jupyter
      containers:
        - name: jupyter
          image: registry.access.redhat.com/ubi9/python-311:latest
          workingDir: /mnt
          ports:
            - containerPort: 8888
              name: jupyter
            - containerPort: 6566
              name: feast
            - containerPort: 8815
              name: feast-offline
          env:
            - name: HOME
              value: /opt/app-root/src
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: "1"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              mkdir -p /mnt/notebooks /mnt/feast_repo /mnt/models
              pip install --no-cache-dir jupyterlab "feast[postgres,grpc]" psycopg2-binary sqlalchemy scikit-learn joblib pandas requests grpcio grpcio-tools grpcio-reflection grpcio-health-checking
              exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.token='workshop' --notebook-dir=/mnt
          volumeMounts:
            - name: workshop-storage
              mountPath: /mnt
      volumes:
        - name: workshop-storage
          persistentVolumeClaim:
            claimName: workshop-pvc
